user  nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

# 万级设备需要大量文件描述符
worker_rlimit_nofile 65535;

events {
    # 每个 worker 最大连接数，万级设备需要 >=20000
    worker_connections 20000;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset utf-8;

    geo $ban_ip {
        default 0;
        include /var/lib/nginx-blacklist/blacklist.map;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript text/xml;
    charset_types text/plain text/css application/json application/javascript text/javascript text/xml;
    gzip_min_length 1024;

    include /etc/nginx/conf.d/*.conf;
}
