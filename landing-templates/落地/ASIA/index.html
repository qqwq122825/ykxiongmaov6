        :root {
            --primary: #FF69B4;
            --secondary: #FF4500;

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }

        /* 背景图容器 - 最底层 */
        .bg-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: url('./60/index369.jpg') no-repeat center center;
            background-size: cover;
        }

        /* PC端使用 bg.png */
        @media (min-width: 1024px) {
            .bg-wrapper {
                background-image: url('bg.png');
            }
        }

        /* 遮罩层 - 在背景之上，内容之下 */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 60%, rgba(0,0,0,0.2) 100%);
            z-index: 2;
            pointer-events: none; /* 让遮罩层不干扰点击事件 */
        }

        /* 内容容器 - 最顶层 */
        .content-wrapper {
            position: relative;
            z-index: 3;
            width: 100%;
            max-width: 448px;
            padding-left: 1.5rem;
            padding-right: 1.5rem;
            padding-bottom: 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 auto;
        }

        /* 确保内容可见且可点击 */
        .gradient-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            z-index: 4;
            box-shadow: none !important; /* 强制移除阴影 */
            border: none;
        }

        .gradient-btn:active {
            transform: scale(0.96);
            filter: brightness(1.1);
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 2rem;
            position: relative;
            z-index: 4;
            box-shadow: none !important; /* 强制移除阴影 */
        }

        /* 入场动画 */
        .fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* 确保所有元素都没有阴影 */
        * {
            box-shadow: none !important;
            text-shadow: none !important;
        }
        
        /* 工具类 */
        .w-full { width: 100%; }
        .max-w-md { max-width: 448px; }
        .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
        .pb-16 { padding-bottom: 4rem; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .text-center { text-align: center; }

        .opacity-40 { opacity: 0.4; }
        .leading-relaxed { line-height: 1.625; }

</head>
