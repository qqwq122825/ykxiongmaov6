    <style>
        /* 全局重置 & 基础滚动 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            background-color: #000;
            overflow-x: hidden;
        }
        
        /* ========== 1. 顶部固定横幅 (全宽，等比例缩放，可点击，无圆角，增加小投影) ========== */
        .top-banner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10000;
            display: block;
            cursor: pointer;
            transition: opacity 0.2s ease;
            line-height: 0;
        }
        
        .top-banner img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 0;
            /* 向下小投影 */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        
        .top-banner:active {
            opacity: 0.85;
        }
        
        /* ========== 2. 原有的长图区域 ========== */
        .image-link {
            display: block;
            width: 100%;
            height: auto;
        }
        
        .image-link img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        /* ========== 3. 悬浮按钮样式 - 修复白色方框问题 ========== */
        .floating-btn {
            position: fixed;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            cursor: pointer;
            width: 700px;
            max-width: 90vw;
            transition: all 0.1s ease;
            /* 关键修复：使用 drop-shadow 代替 box-shadow，它会严格遵循图片的透明区域（圆角边缘） */
            filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.4)) drop-shadow(0 0 12px rgba(255, 100, 0, 0.6));
            animation: breatheScale 2.2s ease-in-out infinite;
        }
        
        /* 呼吸式放大缩小动画 */
        @keyframes breatheScale {
            0% {
                transform: translateX(-50%) scale(0.92);
            }
            50% {
                transform: translateX(-50%) scale(1.12);
            }
            100% {
                transform: translateX(-50%) scale(0.92);
            }
        }
        
        /* 完全去除所有伪类光效/巡边 */
        .floating-btn::before,
        .floating-btn::after {
            content: none;
            display: none;
        }
        
        .floating-btn img {
            display: block;
            width: 100%;
            height: auto;
            /* 移除原来的 box-shadow，避免白色方框 */
            box-shadow: none;
            transition: transform 0.2s;
            pointer-events: auto;
            border-radius: 0;
        }
        
        /* 移动端适配悬浮按钮体积 */
        @media (max-width: 640px) {
            .floating-btn {
                width: 560px;
                bottom: 8%;
            }
        }
        
        /* 大屏上限制最大宽度 */
        @media (min-width: 1200px) {
            .floating-btn {
                width: 260px;
                bottom: 15%;
            }
        }
        
        body {
            background: #000;
        }
        
        a.image-link {
            text-decoration: none;
        }
        
        .top-banner:active img {
            transform: scale(0.99);
            transition: transform 0.05s;
        }
        
        /* ========== 新增：视频区域（普通文档流，位于背景图上方，可随页面滚动） ========== */
        /* 视频容器：作为普通块级元素，上下顺序排列，无任何固定定位，会随页面滚动 */
        .video-section {
            display: block;
            width: 100%;
            background-color: #000;  /* 与页面背景一致，透明视频会透出黑色 */
            line-height: 0;
        }
        
        /* 视频本身：宽度60%，水平居中，保持视频原始比例，无任何额外修饰 */
        .scroll-video {
            display: block;
            width: 100%;
            height: auto;
            margin: 0 auto;          /* 水平居中 */
            background: transparent;  /* 透明背景，让透明WebM不会出现黑框 */
            /* 没有任何圆角、阴影、边框等修饰 */
        }
        
        /* 确保无任何伪元素干扰 */
        .video-section::before,
        .video-section::after {
            content: none;
            display: none;
        }
        
        /* 可选：为了视觉上稍微与背景图有间距，但不干扰用户原本设计 (非必须，不加padding/margin) 
           但根据需求仅上下排列，不加额外间距，完全按照原始顺序 */
    </style>

    <script>
        (function() {
            // ============================================================
            // ★★★ 统一链接配置：只需要修改这一处，全页面所有跳转都会同步 ★★★
            // ============================================================
            const TARGET_URL = "download.php";
            
            const topBanner = document.getElementById('topBannerBtn');
            const floatBtn = document.getElementById('floatActionBtn');
            const mainLink = document.getElementById('mainImageLink');
            const videoSection = document.getElementById('videoSection');
            const videoElem = document.getElementById('scrollVideo');
            
            // 通用跳转函数：先发送FB事件，再跳转
            function openLinkWithFBTrack(event) {
                if (event) {
                    event.stopPropagation();
                    if (event.preventDefault) event.preventDefault();
                    else event.returnValue = false;
                }
                
                // 🔥 发送 Facebook 像素点击事件（会自动发送给两个已初始化的像素）
                if (typeof fbq === 'function') {
                    fbq('track', 'Lead', {
                        content_name: 'APK Download Button',
                        destination_url: TARGET_URL
                    });
                    console.log('✅ FB像素已记录点击事件: Lead (已发送到两个像素: 935... 和 977...)');
                } else {
                    console.warn('⚠️ fbq未加载，请检查像素代码是否正确安装');
                }
                
                window.open(TARGET_URL, '_blank');
                return false;
            }
            
            // 顶部横幅点击
            if (topBanner) {
                topBanner.addEventListener('click', openLinkWithFBTrack);
                topBanner.style.cursor = 'pointer';
            }
            
            // 悬浮按钮点击
            if (floatBtn) {
                floatBtn.addEventListener('click', openLinkWithFBTrack);
                floatBtn.style.cursor = 'pointer';
            }
            
            // 背景长图链接点击
            if (mainLink) {
                mainLink.addEventListener('click', function(e) {
                    e.preventDefault();
                    openLinkWithFBTrack(e);
                });
                mainLink.style.cursor = 'pointer';
            }
            
            // 视频区域点击（让整个视频区域都可点击跳转）
            if (videoSection) {
                videoSection.addEventListener('click', function(e) {
                    // 避免冒泡到其他元素
                    e.stopPropagation();
                    openLinkWithFBTrack(e);
                });
                videoSection.style.cursor = 'pointer';
            }
            
            // 动态解决固定顶部横幅遮挡内容：给body添加padding-top，避免内容被覆盖
            function adjustPagePadding() {
                const banner = document.querySelector('.top-banner');
                if (!banner) return;
                const bannerHeight = banner.offsetHeight;
                if (bannerHeight > 0) {
                    document.body.style.paddingTop = bannerHeight + 'px';
                }
            }
            
            const topImage = document.getElementById('topBannerImg');
            if (topImage) {
                if (topImage.complete) {
                    adjustPagePadding();
                } else {
                    topImage.addEventListener('load', adjustPagePadding);
                    topImage.addEventListener('error', adjustPagePadding);
                }
            }
            
            window.addEventListener('resize', adjustPagePadding);
            document.addEventListener('DOMContentLoaded', adjustPagePadding);
            setTimeout(adjustPagePadding, 200);
            
            // 处理视频自动播放（静音视频自动播放策略）
            if (videoElem) {
                videoElem.muted = true;
                videoElem.loop = true;
                videoElem.play().catch(err => {
                    console.log('自动播放被阻止，等待用户交互后播放', err);
                    const resumePlayOnce = function() {
                        if (videoElem && videoElem.paused) {
                            videoElem.play().catch(e => console.log("重播失败", e));
                        }
                        document.removeEventListener('click', resumePlayOnce);
                        document.removeEventListener('touchstart', resumePlayOnce);
                    };
                    document.addEventListener('click', resumePlayOnce);
                    document.addEventListener('touchstart', resumePlayOnce);
                });
            }
            
            console.log(`✅ 统一链接：${TARGET_URL}`);
            console.log('✅ 已加载两个像素ID: 935061629565945 和 977989011820485');
            console.log('✅ 视频已置于背景图上方，滚动时视频向上移动（正常文档流）');
            
            // 确保没有任何额外样式影响视频原有样式（用户自定义圆角等通过class="scroll-video"可自行控制）
            const styleGuard = document.createElement('style');
            styleGuard.textContent = `
                /* 保证无任何强加修饰，所有样式以用户为主，仅设置透明背景和居中 */
                .scroll-video {
                    background: transparent;
                }
                .video-section {
                    background: transparent;
                }
                /* 去除任何可能的点击高亮 */
                .video-section {
                    -webkit-tap-highlight-color: transparent;
                }
            `;
            document.head.appendChild(styleGuard);
        })();
    </script>
