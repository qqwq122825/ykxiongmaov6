    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
        }
        body {
            display: flex;
            flex-direction: column;
            background: url(./16/static/images/bg-51.png) no-repeat;
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            height: 100%;
        }
        header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 10px 10px 0;
            flex-shrink: 0;
        }
        header img:first-child {
            width: 30%;
            height: auto;
        }
        main {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            min-height: 0;
        }
        main img:first-child {
            width: 100%;
            height: auto;
            flex-shrink: 0;
        }
        main img:nth-child(2) {
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 100%;
            flex: 1;
            object-fit: contain;
            object-position: center;
            min-height: 0;
        }
        main img:last-child {
            position: absolute;
            bottom: 11%;
            right: 8%;
            width: 40%;
            height: auto;
        }
        footer {
            padding: 10px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }
        .box {
            display: flex;
            justify-content: space-between;
            width: 100%;
            gap: 10px;
        }
        .box img {
            width: calc((100% - 20px) / 3);
            height: auto;
            margin-bottom: 10px;
            cursor: pointer;
        }
        footer > img:first-of-type {
            width: 50%;
            height: auto;
        }
        footer > img:nth-of-type(2) {
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
