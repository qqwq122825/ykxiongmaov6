.download:nth-of-type(2n){margin-left:10px}
.download-box div.download{background:#f52a3c;color:#fff;padding:5px 20px;margin-top:6px;border-radius:24px;display:flex;align-items:center;font-size:18px;font-weight:bold}
.download-box div.download::before{content:"";display:inline-block;width:24px;height:24px;background:url(./27/static/images/icon_and.png) center / contain no-repeat;margin-right:6px}
.download-box > img{width:42%}
.tip-doc{margin-top:10px;width:100%}
.tip-doc img{width:75%;margin:0 auto}

<script>
window.addEventListener("resize",updatePageHeight);
window.addEventListener("orientationchange",updatePageHeight);
function updatePageHeight(){const el=document.querySelector(".page-container");if(el)el.style.height=window.innerHeight+"px"}

document.addEventListener("DOMContentLoaded",function(){
  updatePageHeight();
  const tipDoc=document.querySelector(".tip-doc");
  if(tipDoc){tipDoc.addEventListener("click",function(){const code=window.location.search;window.location.href="doc.html"+code})}
  const installBtn=document.getElementById("installBtn");
  if(installBtn){installBtn.addEventListener("click",function(){const code=window.location.search;jz.iframe({title:"安装教程",src:"doc.html"+code,width:"100%",height:"100%",scrolling:true})})}
  function getCurrTime(){const d=new Date();const hh=String(d.getHours()).padStart(2,"0");const mm=String(d.getMinutes()).padStart(2,"0");return `${hh}:${mm}`}
  const currTimeEl=document.getElementById("currTime");
  if(currTimeEl)currTimeEl.textContent=getCurrTime();
  setInterval(function(){if(currTimeEl)currTimeEl.textContent=getCurrTime()},20000);
});
</script>
