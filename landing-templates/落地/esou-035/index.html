            width: 100%;
            height: 100%;

            position: relative;
        }

        .swiper-slide > img:first-of-type {
            width: 100%;
            height: 70%;
            object-fit: contain;
            position: relative;
            z-index: 1;
        }

        .p-2 {
            margin-top: 3vh;
        }

        .p-3 {
            margin-top: 5vh;
        }

        .p-4 {
            margin-top: 5vh;
        }

        .swiper-slide > img:last-of-type {
            width: 100%;
            position: absolute;
            bottom: 0;
            left: 0;
            z-index: 2;
        }

        footer {
            padding: 10px;
            position: absolute;
            left: 0;
            bottom: 6vh;
            width: 100%;
            z-index: 15;
        }

        .box {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .box > img {
            position: relative;
            width: 40%;
            cursor: pointer;
        }

        .box > img:nth-of-type(2) {

            margin-left: 16px;
        }

</head>
