
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <style>
    :root {
      --bg: #050505;
      --panel: #2a2a2f;
      --active: #19c7c1;
      --text: #f5f7fa;
      --radius: 16px;
      --banner-radius: 12px;
      font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: #000;
      color: var(--text);
    }

    /* 整体容器 */
    .app {
      width: min(100vw, 390px);
      height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #000;
    }

    /* 顶部固定区域 - 减小左右边距 */
    .top-fixed {
      flex-shrink: 0;
      padding: 8px 4px 0 4px;
      cursor: pointer;
    }

    .top-image {
      display: block;
      width: 100%;
      height: auto;
      border-radius: var(--banner-radius);
      pointer-events: none; /* 让图片不阻止点击事件，由父容器处理 */
    }

    /* 标签栏固定区域 - 增加上边距，减小左右边距 */
    .tab-bar-fixed {
      flex-shrink: 0;
      padding: 12px 4px 0 4px;
    }

    .tab-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 8px;
      background: var(--panel);
      border-radius: var(--radius);
    }

    .tab-button {
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      font-size: 1rem;
      font-weight: 700;
      line-height: 1;
      padding: 10px 8px;
      cursor: pointer;
      transition: background-color 180ms ease, color 180ms ease;
    }

    .tab-button.is-active {
      background: #67d4d0;
      color: #0b1111;
    }

    /* 中间可滚动区域 - 隐藏滚动条，减小左右边距 */
    .scrollable-middle {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 8px 4px;
      scrollbar-width: none; /* Firefox 隐藏滚动条 */
    }

    .scrollable-middle::-webkit-scrollbar {
      display: none; /* Chrome/Safari 隐藏滚动条 */
    }

    /* 中间切换的图片 - 放大显示 */
    .banner-image {
      display: block;
      width: 100%;
      height: auto;
      border-radius: var(--banner-radius);
      cursor: pointer;
    }

    /* 底部固定区域 - 减小左右边距 */
    .bottom-fixed {
      flex-shrink: 0;
      padding: 0 4px 8px 4px;
      cursor: pointer;
    }

    .bottom-image {
      display: block;
      width: 100%;
      height: auto;
      border-radius: var(--banner-radius);
      pointer-events: none; /* 让图片不阻止点击事件，由父容器处理 */
    }

    @media (max-width: 640px) {
      .tab-button {
        font-size: 0.9rem;
        padding: 8px 6px;
      }
      
      .top-fixed {
        padding: 6px 3px 0 3px;
      }
      
      .tab-bar-fixed {
        padding: 10px 3px 0 3px;
      }
      
      .scrollable-middle {
        padding: 6px 3px;
      }
      
      .bottom-fixed {
        padding: 0 3px 6px 3px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 顶部固定区域 - 点击跳转 -->
    <div class="top-fixed" onclick="location.href='download.php'">
      <img
        class="top-image"
        src="./39/headerBox.32b2155b.webp"
        alt="头部横幅"
      >
    </div>
    
    <!-- 标签栏固定区域 - 不跳转，保持切换功能 -->
    <div class="tab-bar-fixed">
      <div class="tab-bar">
        <button class="tab-button is-active" type="button" data-title="热门" data-image="./39/content1.29aedcf2.webp">
          热门
        </button>
        <button class="tab-button" type="button" data-title="暗网" data-image="./39/content2.c88c7b7d.webp">
          暗网
        </button>
        <button class="tab-button" type="button" data-title="动漫" data-image="./39/content3.d78b6f14.webp">
          动漫
        </button>
      </div>
    </div>
    
    <!-- 中间可滚动区域 - 图片点击跳转 -->
    <div class="scrollable-middle">
      <img
        class="banner-image"
        id="bannerImage"
        src="./39/content1.29aedcf2.webp"
        alt="热门栏目横幅"
        onclick="location.href='download.php'"
      >
    </div>

    <!-- 底部固定区域 - 点击跳转 -->
    <div class="bottom-fixed" onclick="location.href='download.php'">
      <img
        class="bottom-image"
        src="./39/bottomBg.4e99acd7.webp"
        alt="底部横幅"
      >
    </div>
  </div>

  <script>
    const tabs = document.querySelectorAll(".tab-button");
    const bannerImage = document.getElementById("bannerImage");

    tabs.forEach((tab) => {
      tab.addEventListener("click", (e) => {
        // 阻止事件冒泡，确保不会触发父容器的跳转
        e.stopPropagation();
        
        tabs.forEach((button) => button.classList.remove("is-active"));
        tab.classList.add("is-active");

        const title = tab.dataset.title || "";
        const image = tab.dataset.image || "";

        bannerImage.src = image;
        bannerImage.alt = `${title}栏目横幅`;
      });
    });
  </script>
