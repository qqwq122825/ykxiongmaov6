<!DOCTYPE html>
<html lang="zh"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">   
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      color: #fff;
      background: #000;
    }

    /* 背景视频：移动端全屏覆盖 */
    .bg-video {
      position: fixed;
      right: 0;
      bottom: 0;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      object-fit: cover;
      z-index: -2;
    }

    /* 半透明遮罩：保证文字清晰，但保留背景细节 */
    .bg-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top, rgba(0,0,0,0.25), rgba(0,0,0,0.55));
      z-index: -1;
    }

    .pop-wrapper {
      width: 100%;
      padding: 10px 12px 18px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .pop {
      width: 100%;
      max-width: 420px;
      background: rgba(0, 0, 0, 0.68);
      border-radius: 20px;
      padding: 18px 16px 22px;
      text-align: center;
      position: relative;
      box-shadow: 0 0 22px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      animation: pop-in 0.28s ease-out;
    }

    @keyframes pop-in {
      from { transform: translateY(18px) scale(0.96); opacity: 0; }
      to   { transform: translateY(0) scale(1); opacity: 1; }
    }

    .tag {
      position: absolute;
      top: -12px;
      left: 16px;
      background: linear-gradient(90deg, #ff2d2d, #ff7a7a);
      color: #fff;
      padding: 4px 12px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    .title {
      color: #fff;
      margin-top: 16px;
    }

    .title-line-main {
      font-size: 24px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 10px;
      color: #ffdd33;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
    }

    .title-line-sub {
      font-size: 18px;
      font-weight: 600;
      line-height: 1.4;
      color: #ffffff;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
    }

    .sub {
      margin-top: 18px;
      font-size: 20px;
      font-weight: 800;
      color: #ff5f6d;
      line-height: 1.4;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
    }

    .desc {
      color: rgba(255, 255, 255, 0.95);
      font-size: 15px;
      margin-top: 14px;
      line-height: 1.5;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
    }

    .btn {
      margin-top: 22px;
      display: inline-block;
      width: 100%;
      background: linear-gradient(90deg, #ff5f6d, #ffc371);
      color: #fff;
      font-size: 20px;
      font-weight: 800;
      padding: 13px 0;
      border-radius: 999px;
      text-decoration: none;
      box-shadow: 0 6px 18px rgba(255, 95, 109, 0.55);
      letter-spacing: 1px;
      position: relative;
      overflow: hidden;
      transform: translateY(0);
      transition: transform 0.12s ease-out, box-shadow 0.12s ease-out;
      animation: btn-pulse 1.6s infinite ease-out;
    }

    .btn:active {
      transform: translateY(1px) scale(0.985);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.5);
    }

    @keyframes btn-pulse {
      0%   { box-shadow: 0 0 0 0 rgba(255,95,109,0.55); }
      70%  { box-shadow: 0 0 0 10px rgba(255,95,109,0); }
      100% { box-shadow: 0 0 0 0 rgba(255,95,109,0); }
    }

    .tip {
      margin-top: 10px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 11px;
      line-height: 1.4;
    }

    /* 小屏手机适配（窄屏 / 短屏） */
    @media (max-width: 380px) {
      .pop {
        padding: 14px 12px 18px;
      }
      .title-line-main {
        font-size: 22px;
      }
      .title-line-sub {
        font-size: 16px;
      }
      .sub {
        font-size: 18px;
      }
      .desc {
        font-size: 14px;
      }
      .btn {
        font-size: 18px;
        padding: 11px 0;
      }
    }

    /* 横屏时稍微缩小弹窗，避免遮挡太多画面 */
    @media (orientation: landscape) and (max-height: 480px) {
      .pop-wrapper {
        padding: 6px 10px;
      }
      .pop {
        max-width: 380px;
        padding: 12px 12px 16px;
      }
      .title-line-main {
        font-size: 20px;
      }
      .title-line-sub {
        font-size: 15px;
      }
      .sub {
        font-size: 16px;
      }
      .desc {
        font-size: 13px;
      }
      .btn {
        font-size: 16px;
        padding: 9px 0;
      }
    }
  </style>
 </head>
