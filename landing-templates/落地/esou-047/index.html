    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
        }

        .service-platform {
            min-height: 100vh;
            background: url("./47/static/sytu.26b90842.jpg") center center / 100% 100% no-repeat fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .loading-container {
            display: none;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .loading-dot {
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            animation: pulse 1s ease-in-out infinite;
        }

        .loading-dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-dot:nth-child(3) { animation-delay: 0.4s; }
        .loading-dot:nth-child(4) { animation-delay: 0.6s; }
        .loading-dot:nth-child(5) { animation-delay: 0.8s; }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .popup-content {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            max-width: 400px;
            width: 100%;
            margin: 0 auto;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }

        .popup-header {
            background: linear-gradient(135deg, #1a5bbf 0%, #0e3a7a 100%);
            padding: 20px;
            text-align: center;
        }

        .popup-header p {
            color: #fff;
            font-size: 20px;
            font-weight: 600;
            margin: 0;
        }

        .popup-body {
            padding: 24px 20px;
            line-height: 1.6;
            color: #333;
            font-size: 15px;
        }

        .highlight {
            color: #ff5f2e;
            font-weight: 600;
        }

        .submit-button {
            padding: 0 20px 24px;
        }

        .aaa {
            background: linear-gradient(90deg, #4374e0, #1a5bbf);
            border: none;
            padding: 14px 0;
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            display: block;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(67, 116, 224, 0.3);
        }

        .aaa:active {
            transform: scale(0.98);
            box-shadow: 0 2px 6px rgba(67, 116, 224, 0.3);
        }

        .wrap {
            margin-top: 20px;
            text-align: center;
        }

        .wrap p {
            font-size: 12px;
            color: #888;
            line-height: 1.6;
            margin: 0;
        }

.footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    text-align: center;
    padding: 16px 20px;
    background: #f8f9fa;
    border-top: 1px solid #e5e5e5;
}

.footer p {
    font-size: 10px;
    color: #999;
    line-height: 1.5;
    margin: 4px 0;
}

        @media (max-width: 480px) {
            .popup-header p {
                font-size: 18px;
            }
            .popup-body {
                padding: 20px 16px;
                font-size: 14px;
            }
            .aaa {
                padding: 12px 0;
                font-size: 15px;
            }
        }
    </style>
</head>
