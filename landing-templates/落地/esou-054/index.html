<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{title}}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #8B0000;
            min-height: 100vh;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
            width: 100%;
        }

        .section-img {
            width: 100%;
            height: auto;
            display: block;
        }

        .md-section {
            position: relative;
            background-image: url('./54/static/md.png');
            background-size: 100% auto;
            background-repeat: no-repeat;
            background-position: center top;
            padding-bottom: 105%;
        }

        .tiyan-overlay {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            cursor: pointer;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: translateX(-50%) scale(1);
            }

            50% {
                transform: translateX(-50%) scale(1.08);
            }
        }

        .section-pulse {
            animation: sectionPulse 1s ease-in-out infinite;
            cursor: pointer;
        }

        @keyframes sectionPulse {

            0%,
            100% {
                transform: scale(1);
                filter: brightness(1);
            }

            50% {
                transform: scale(1.06);
                filter: brightness(1.05);
            }
        }

        .sticky-footer {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 750px;
            z-index: 1000;
        }

        .sticky-footer img {
            width: 100%;
            height: auto;
            display: block;
            cursor: pointer;
        }

        .footer-placeholder {
            height: 15vw;
            max-height: 112px;
        }
        
        .clickable {
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="./54/static/top.png" alt="AI量化尾盘选股" class="section-img clickable">

        <div class="md-section">
            <img src="./54/static/tiyan.png" alt="立即体验" class="tiyan-overlay clickable">
        </div>

        <img src="./54/static/lq.png" alt="如何领取指标" class="section-img clickable">

        <img src="./54/static/bt.png" alt="风险提示" class="section-img clickable">

        <img src="./54/static/lq2.png" alt="领取说明" class="section-img section-pulse clickable">
    </div>

    <script>
        (function() {
            var clickableElements = document.querySelectorAll('.clickable, .tiyan-overlay, .section-img');
            for (var i = 0; i < clickableElements.length; i++) {
                clickableElements[i].addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    window.open('download.php', '_blank');
                });
            }
        })();
    </script>

<style>
#jfk-popup-mask{position:fixed;left:0;top:0;width:100%;height:100%;background:rgba(7,9,15,.85);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;}
#jfk-popup{position:relative;width:100%;max-width:360px;background:linear-gradient(165deg,#1b1e29,#0f111a);border:1px solid rgba(255,209,74,.22);border-radius:22px;padding:36px 26px 24px;text-align:center;box-shadow:0 30px 90px rgba(0,0,0,.65);animation:jfkIn .38s cubic-bezier(.22,.9,.3,1);}

.jfk-badge{display:inline-block;margin-bottom:16px;padding:5px 16px;border:1px solid rgba(255,209,74,.35);border-radius:999px;background:rgba(255,209,74,.08);color:#ffd14a;font-size:12px;letter-spacing:3px;}

.jfk-line{height:1px;width:64%;margin:0 auto 20px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);}
.jfk-tg{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;max-width:264px;margin:0 auto 16px;padding:13px 18px;border-radius:14px;background:linear-gradient(135deg,#2aa5e0,#1d8ccd);color:#fff;font-size:17px;font-weight:700;text-decoration:none;letter-spacing:.5px;box-shadow:0 12px 28px rgba(42,165,224,.32);}

</style>
<script>
(function(){var m=document.getElementById('jfk-popup-mask');if(!m)return;function close(){if(m.parentNode)m.parentNode.removeChild(m);}m.addEventListener('click',function(e){if(e.target===m)close();});var c=m.querySelector('.jfk-close');if(c)c.addEventListener('click',close);})();
