    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            height: 100vh;
            background: #000;
        }
        
        /* 所有图片都变成可点击按钮 */
        .clickable-img {
            display: block;
            width: 100%;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        
        /* 按钮悬停效果 */
        .clickable-img:hover {
            opacity: 0.9;
            transform: scale(1.01);
        }
        
        /* 按钮点击效果 */
        .clickable-img:active {
            transform: scale(0.99);
        }
        
        /* 顶部固定图片按钮 */
        .top-img {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
        }
        
        /* 底部固定图片按钮 */
        .bottom-img {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 100;
        }
        
        /* 中间可滚动区域 - 跟随页面放大缩小 */
        .scroll-area {
            position: fixed;
            top: 15vh; /* 从顶部图片下方开始 */
            bottom: 15vh; /* 到底部图片上方结束 */
            left: 0;
            width: 100%;
            overflow-y: auto;
            z-index: 10;
        }
        
        /* 中间长图按钮 */
        .middle-img {
            width: 100%;
            /* 使用min-height确保图片在缩放时保持合适大小 */
            min-height: calc(70vh); /* 100vh - 顶部15vh - 底部15vh */
            height: auto;
            display: block;
            /* 确保图片填充整个区域 */
            object-fit: cover;
        }
        
        /* 确保所有图片宽度100%，高度自适应 */
        .top-img img,
        .bottom-img img,
        .scroll-area img {
            width: 100%;
            height: auto;
            object-fit: cover;
        }
        
        /* 隐藏滚动条 */
        .scroll-area::-webkit-scrollbar {
            display: none;
        }
        
        .scroll-area {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* 响应式调整 */
        @media (max-width: 768px) {
            .top-img {
                height: 12vh;
            }
            
            .bottom-img {
                height: 12vh;
            }
            
            .scroll-area {
                top: 12vh;
                bottom: 12vh;
            }
            
            .middle-img {
                min-height: calc(76vh); /* 100vh - 12vh - 12vh */
            }
        }
    </style>

    <script>
        // 确保中间图片随窗口大小变化调整
        function adjustMiddleImage() {
            const topHeight = document.querySelector('.top-img').offsetHeight;
            const bottomHeight = document.querySelector('.bottom-img').offsetHeight;
            const windowHeight = window.innerHeight;
            const scrollArea = document.querySelector('.scroll-area');
            const middleImg = document.querySelector('.middle-img');
            
            // 动态计算中间区域的高度
            const middleHeight = windowHeight - topHeight - bottomHeight;
            
            // 设置滚动区域的位置和高度
            scrollArea.style.top = topHeight + 'px';
            scrollArea.style.bottom = bottomHeight + 'px';
            scrollArea.style.height = middleHeight + 'px';
            
            // 确保中间图片至少填满整个区域
            middleImg.style.minHeight = middleHeight + 'px';
            
            // 如果图片实际高度更大，使用实际高度
            if (middleImg.naturalHeight > 0 && middleImg.naturalHeight > middleHeight) {
                middleImg.style.height = 'auto';
                middleImg.style.minHeight = 'none';
            }
        }
        
        // 页面加载时调整
        window.addEventListener('load', adjustMiddleImage);
        
        // 窗口大小改变时调整
        window.addEventListener('resize', adjustMiddleImage);
        
        // 图片加载完成后调整
        document.querySelectorAll('.clickable-img img').forEach(img => {
            img.addEventListener('load', function() {
                setTimeout(adjustMiddleImage, 100);
            });
        });
        
        // 添加点击提示效果
        document.querySelectorAll('.clickable-img').forEach(button => {
            // 添加点击事件监听
            button.addEventListener('click', function(e) {
                console.log('跳转到: ' + this.href);
                
                // 可选：添加点击动画效果
                this.style.transform = 'scale(0.98)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 200);
            });
            
            // 添加键盘导航支持
            button.setAttribute('tabindex', '0');
            button.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    this.click();
                }
            });
        });
        
        // 图片加载失败处理
        document.querySelectorAll('img').forEach(img => {
            img.onerror = function() {
                console.log('图片加载失败: ' + this.src);
                // 可以设置备用图片或显示替代内容
                this.style.backgroundColor = '#333';
                this.style.minHeight = '50px';
                this.alt = '图片加载失败，点击可跳转';
                adjustMiddleImage();
            };
        });
    </script>
