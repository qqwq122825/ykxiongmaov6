    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, calc(-50% + 20px)); }
      to { opacity: 1; transform: translate(-50%, -50%); }
    }
    @keyframes pulseGlow {
      0%, 100% {
        box-shadow:
          0 6px 22px rgba(22, 119, 255, 0.5),
          0 0 0 0 rgba(22, 119, 255, 0.45);
      }
      50% {
        box-shadow:
          0 8px 32px rgba(22, 119, 255, 0.65),
          0 0 0 10px rgba(22, 119, 255, 0);
      }
    }
    @keyframes shine {
      0% { left: -100%; }
      45%, 100% { left: 150%; }
    }
    @keyframes iconBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
