<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3F3D9E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6584;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF3366;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000030"/>
    </filter>
  </defs>

  <!-- Icon: Live broadcast symbol -->
  <g transform="translate(16, 20)" filter="url(#shadow)">
    <!-- Outer circle -->
    <circle cx="40" cy="40" r="36" fill="url(#grad1)" />
    <!-- Inner play triangle -->
    <polygon points="28,18 28,62 62,40" fill="#FFFFFF" opacity="0.95"/>
    <!-- Live dot -->
    <circle cx="40" cy="8" r="6" fill="url(#grad2)">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Text: MyAvLive -->
  <g filter="url(#shadow)">
    <text x="108" y="76" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="1">
      <tspan fill="url(#grad1)">My</tspan><tspan fill="#2D2B55">Av</tspan><tspan fill="url(#grad2)">Live</tspan>
    </text>
  </g>

  <!-- Subtle underline accent -->
  <line x1="108" y1="88" x2="370" y2="88" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
</svg>