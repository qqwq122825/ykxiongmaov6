        const contentConfig = [

            {

                mainTitle: '抖音精选',
                description: '条条都是宝藏视频',
                ctaText: '下载抖音精选看更多'
            }
        ];

        // 获取元素
        const bgImages = document.querySelectorAll('.bg-image');
        const dots = document.querySelectorAll('.dot');
        const subtitle = document.getElementById('subtitle');
        const mainTitle = document.getElementById('mainTitle');
        const description = document.getElementById('description');
        const ctaText = document.getElementById('ctaText');
        const contentText = document.getElementById('contentText');

        let currentIndex = 0;
        const totalImages = bgImages.length;

        // 切换背景图
        function switchBackground(index) {
            // 更新背景图
            bgImages.forEach((img, i) => {
                img.classList.toggle('active', i === index);
            });

            // 更新分页指示器
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === index);
            });

            // 更新内容文字
            const config = contentConfig[index];
            
            // 先隐藏文字
            contentText.classList.add('hidden');
            
            // 延迟更新内容，实现淡入淡出效果
            setTimeout(() => {
                subtitle.innerHTML = config.subtitle;
                mainTitle.textContent = config.mainTitle;
                description.textContent = config.description;
                ctaText.textContent = config.ctaText;
                
                // 显示文字
                setTimeout(() => {
                    contentText.classList.remove('hidden');
                }, 50);
            }, 300);
        }

        // 自动切换
        function autoSwitch() {
            currentIndex = (currentIndex + 1) % totalImages;
            switchBackground(currentIndex);
        }

        // 点击分页指示器切换
        dots.forEach((dot, index) => {
            dot.addEventListener('click', () => {
                currentIndex = index;
                switchBackground(currentIndex);
                // 重置自动切换计时器
                clearInterval(autoSwitchInterval);
                autoSwitchInterval = setInterval(autoSwitch, 5000);
            });
        });

        // 每5秒自动切换一次
        let autoSwitchInterval = setInterval(autoSwitch, 5000);

        // 鼠标悬停时暂停自动切换
        let isHovering = false;
        document.addEventListener('mouseenter', () => {
            isHovering = true;
            clearInterval(autoSwitchInterval);
        }, true);

        document.addEventListener('mouseleave', () => {
            isHovering = false;
            autoSwitchInterval = setInterval(autoSwitch, 5000);
        }, true);

        // 初始化
        switchBackground(0);
    </script>
