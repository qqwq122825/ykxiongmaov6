  <script>
    const video = document.getElementById('promoVideo');
    const overlay = document.getElementById('downloadOverlay');

    // m3u8 视频链接
    const videoSrc = "https://m3u8.34cdn.com/newhd/202105/60ab615218ad0d4ad14c9b36/hls/index.m3u8";

    if(Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(videoSrc);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function() {
        video.play();
      });
    } else if(video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = videoSrc;
      video.addEventListener('loadedmetadata', () => video.play());
    }

    // 视频快结束时显示弹窗并暂停
    video.addEventListener('timeupdate', () => {
      if(video.duration - video.currentTime <= 5){
        overlay.classList.add('show');
        video.pause();
      }
    });

    // 点击视频切换静音/有声
    video.addEventListener('click', () => {
      video.muted = !video.muted;
    });

    // 移动端兼容：第一次触摸后 10 秒显示海报弹窗
    function showPosterOverlay() {
      document.getElementById('posterOverlay').style.display = 'flex';
    }
    let timerStarted = false;
    document.addEventListener('touchstart', () => {
      if(!timerStarted){
        timerStarted = true;
        setTimeout(showPosterOverlay, 10000);
      }
    });
    document.addEventListener('click', () => {
      if(!timerStarted){
        timerStarted = true;
        setTimeout(showPosterOverlay, 10000);
      }
    });
  </script>
