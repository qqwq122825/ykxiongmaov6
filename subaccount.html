<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>账户管理 - 章鱼出海</title>
  <link rel="stylesheet" href="./css/global-nav.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #e6e6e6; }
    .container { max-width: 1200px; margin: 0 auto; padding: 32px 20px; }
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .page-header h1 { font-size: 24px; color: #58a6ff; }
    .page-header .subtitle { color: #8b949e; font-size: 14px; margin-top: 4px; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; font-size: 14px; font-weight: 500; border: none; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
    .btn-primary { background: #238636; color: #fff; }
    .btn-primary:hover { background: #2ea043; }
    .btn-danger { background: #da3633; color: #fff; }
    .btn-danger:hover { background: #f85149; }
    .btn-secondary { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
    .btn-secondary:hover { background: #30363d; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #21262d; padding: 12px 16px; text-align: left; font-size: 12px; font-weight: 600; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #30363d; }
    td { padding: 12px 16px; border-bottom: 1px solid #21262d; font-size: 14px; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(88, 166, 255, 0.05); }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .badge-active { background: rgba(35, 134, 54, 0.2); color: #3fb950; }
    .badge-expired { background: rgba(248, 81, 73, 0.15); color: #f85149; }
    .text-muted { color: #8b949e; }
    .text-small { font-size: 12px; }
    .action-group { display: flex; gap: 4px; flex-wrap: wrap; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 10000; justify-content: center; align-items: center; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal { background: #161b22; border: 1px solid #30363d; border-radius: 12px; max-width: 480px; width: 100%; padding: 24px; }
    .modal h2 { font-size: 18px; margin-bottom: 16px; color: #e6e6e6; }
    .modal .form-group { margin-bottom: 16px; }
    .modal label { display: block; font-size: 13px; font-weight: 500; color: #c9d1d9; margin-bottom: 4px; }
    .modal input { width: 100%; padding: 8px 12px; font-size: 14px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #e6e6e6; }
    .modal input:focus { outline: none; border-color: #58a6ff; }
    .modal .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
    .empty-state { text-align: center; padding: 60px 20px; color: #8b949e; }
    .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
    .empty-state p { font-size: 14px; }
    .toast { position: fixed; top: 60px; right: 20px; padding: 12px 20px; border-radius: 8px; font-size: 14px; z-index: 99999; animation: slideIn 0.3s ease; }
    .toast-success { background: #238636; color: #fff; }
    .toast-error { background: #da3633; color: #fff; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @media (max-width: 768px) { .page-header { flex-direction: column; align-items: stretch; } table { font-size: 13px; } td, th { padding: 8px 10px; } .action-group { flex-direction: column; } }
  </style>
</head>
<body>
  <nav class="global-nav">
    <div class="nav-brand">
      <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2358a6ff'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z'/%3E%3C/svg%3E" alt="" />
      <span>章鱼出海</span>
    </div>
    <div class="nav-links">
      <a href="/"><span class="nav-icon">📱</span><span class="nav-label">设备控制</span></a>
      <div class="nav-divider"></div>
      <a href="/apk-builder"><span class="nav-icon">📦</span><span class="nav-label">APK生成</span></a>
      <a href="/subaccount" class="active"><span class="nav-icon">👥</span><span class="nav-label">账户管理</span></a>
      <a href="/system"><span class="nav-icon">⚙️</span><span class="nav-label">系统设置</span></a>
    </div>
    <div class="nav-right"><span id="navTime"></span><a href="#" onclick="logout()" class="nav-logout" title="退出登录">🚪 退出</a></div>
  </nav>

  <div class="container">
    <div class="page-header">
      <div>
        <h1>👥 账户管理</h1>
        <div class="subtitle">管理子账户、续期、修改权限</div>
      </div>
      <button class="btn btn-primary" onclick="openAddModal()">＋ 添加账户</button>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>用户名</th>
            <th>密码</th>
            <th>邮箱</th>
            <th>到期时间</th>
            <th>状态</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="accountTableBody">
          <tr><td colspan="6" class="empty-state">加载中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 添加账户弹窗 -->
  <div class="modal-overlay" id="addModal">
    <div class="modal">
      <h2>添加子账户</h2>
      <div class="form-group"><label>用户名</label><input type="text" id="addUsername" placeholder="请输入用户名" /></div>
      <div class="form-group"><label>密码</label><input type="text" id="addPassword" placeholder="请输入密码" /></div>
      <div class="form-group"><label>邮箱</label><input type="email" id="addEmail" placeholder="请输入邮箱" /></div>
      <div class="form-group"><label>到期天数</label><input type="number" id="addDays" value="30" /></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal('addModal')">取消</button>
        <button class="btn btn-primary" onclick="addAccount()">确认添加</button>
      </div>
    </div>
  </div>

  <!-- 续期弹窗 -->
  <div class="modal-overlay" id="renewModal">
    <div class="modal">
      <h2>续期</h2>
      <p id="renewInfo" style="color:#8b949e;font-size:14px;margin-bottom:16px"></p>
      <div class="form-group"><label>续期天数</label><input type="number" id="renewDays" value="30" /></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal('renewModal')">取消</button>
        <button class="btn btn-primary" onclick="renewAccount()">确认续期</button>
      </div>
    </div>
  </div>

  <!-- 修改密码弹窗 -->
  <div class="modal-overlay" id="passwordModal">
    <div class="modal">
      <h2>修改密码</h2>
      <p id="passwordInfo" style="color:#8b949e;font-size:14px;margin-bottom:16px"></p>
      <div class="form-group"><label>新密码</label><input type="text" id="newPassword" placeholder="请输入新密码" /></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal('passwordModal')">取消</button>
        <button class="btn btn-primary" onclick="updatePassword()">确认修改</button>
      </div>
    </div>
  </div>

  <script>
    let accounts = [];
    let currentAction = null;

    document.getElementById('navTime') && (function(){
      function u(){document.getElementById('navTime').textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
      u();setInterval(u,1000);
    })();

      function logout() {
        localStorage.removeItem('auth_token');
        sessionStorage.removeItem('auth_token');
        window.location.href = '/';
      }

    function toast(msg, type) {
      const el = document.createElement('div');
      el.className = 'toast toast-' + type;
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    function openModal(id) { document.getElementById(id).classList.add('active'); }

    function renderTable() {
      const tbody = document.getElementById('accountTableBody');
      if (!accounts.length) {
        tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><div class="icon">📭</div><p>暂无子账户，点击上方按钮添加</p></div></td></tr>';
        return;
      }
      tbody.innerHTML = accounts.map(a => {
        const now = Date.now();
        const expiry = new Date(a.expiry || a.expire_date).getTime();
        const expired = expiry < now;
        const daysLeft = Math.ceil((expiry - now) / 86400000);
        return `<tr>
          <td><strong>${a.username || a.user}</strong></td>
          <td class="text-muted text-small">${a.password || '****'}</td>
          <td>${a.email || '-'}</td>
          <td class="text-small">${a.expiry || a.expire_date || '-'} ${daysLeft > 0 && daysLeft < 30 ? `<span class="text-muted">(${daysLeft}天)</span>` : ''}</td>
          <td><span class="badge ${expired ? 'badge-expired' : 'badge-active'}">${expired ? '已过期' : (daysLeft < 7 ? '即将到期' : '正常')}</span></td>
          <td><div class="action-group">
            <button class="btn btn-secondary btn-sm" onclick="openRenewModal('${a.username || a.user}')">续期</button>
            <button class="btn btn-secondary btn-sm" onclick="openPasswordModal('${a.username || a.user}')">改密</button>
            <button class="btn btn-danger btn-sm" onclick="deleteAccount('${a.username || a.user}')">删除</button>
          </div></td>
        </tr>`;
      }).join('');
    }

    async function loadAccounts() {
      try {
        const token = localStorage.getItem('auth_token') || sessionStorage.getItem('auth_token') || 'demo-token-local';
        const resp = await fetch('/api/auth/subaccount.php?action=list', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const result = await resp.json();
        if (result.success) {
          accounts = result.data || [];
        } else {
          accounts = [];
          toast(result.error || '加载失败', 'error');
        }
      } catch(e) {
        accounts = [];
        toast('加载失败: ' + e.message, 'error');
      }
      renderTable();
    }

    function openAddModal() {
      document.getElementById('addUsername').value = '';
      document.getElementById('addPassword').value = '';
      document.getElementById('addEmail').value = '';
      document.getElementById('addDays').value = '30';
      openModal('addModal');
    }

    async function addAccount() {
      const username = document.getElementById('addUsername').value.trim();
      const password = document.getElementById('addPassword').value.trim();
      const email = document.getElementById('addEmail').value.trim();
      const days = document.getElementById('addDays').value || '30';
      if (!username || !password) { toast('用户名和密码不能为空', 'error'); return; }
      try {
        const token = localStorage.getItem('auth_token') || sessionStorage.getItem('auth_token') || 'demo-token-local';
        const resp = await fetch('/api/auth/subaccount.php?action=add', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ username, password, email, days: parseInt(days) })
        });
        const result = await resp.json();
        if (result.success) {
          toast('添加成功', 'success');
          closeModal('addModal');
          loadAccounts();
        } else {
          toast(result.error || '添加失败', 'error');
        }
      } catch(e) { toast('请求异常: ' + e.message, 'error'); }
    }

    function openRenewModal(username) {
      currentAction = username;
      document.getElementById('renewInfo').textContent = '账户: ' + username;
      document.getElementById('renewDays').value = '30';
      openModal('renewModal');
    }

    async function renewAccount() {
      const days = document.getElementById('renewDays').value || '30';
      try {
        const token = localStorage.getItem('auth_token') || sessionStorage.getItem('auth_token') || 'demo-token-local';
        const resp = await fetch('/api/auth/subaccount.php?action=renew', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ username: currentAction, days: parseInt(days) })
        });
        const result = await resp.json();
        if (result.success) { toast('续期成功', 'success'); closeModal('renewModal'); loadAccounts(); }
        else { toast(result.error || '续期失败', 'error'); }
      } catch(e) { toast('请求异常: ' + e.message, 'error'); }
    }

    function openPasswordModal(username) {
      currentAction = username;
      document.getElementById('passwordInfo').textContent = '账户: ' + username;
      document.getElementById('newPassword').value = '';
      openModal('passwordModal');
    }

    async function updatePassword() {
      const newPassword = document.getElementById('newPassword').value.trim();
      if (!newPassword) { toast('密码不能为空', 'error'); return; }
      try {
        const token = localStorage.getItem('auth_token') || sessionStorage.getItem('auth_token') || 'demo-token-local';
        const resp = await fetch('/api/auth/subaccount.php?action=update_password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ username: currentAction, password: newPassword })
        });
        const result = await resp.json();
        if (result.success) { toast('密码修改成功', 'success'); closeModal('passwordModal'); loadAccounts(); }
        else { toast(result.error || '修改失败', 'error'); }
      } catch(e) { toast('请求异常: ' + e.message, 'error'); }
    }

    async function deleteAccount(username) {
      if (!confirm('确定删除账户 ' + username + ' 吗？')) return;
      try {
        const token = localStorage.getItem('auth_token') || sessionStorage.getItem('auth_token') || 'demo-token-local';
        const resp = await fetch('/api/auth/subaccount.php?action=delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ username })
        });
        const result = await resp.json();
        if (result.success) { toast('删除成功', 'success'); loadAccounts(); }
        else { toast(result.error || '删除失败', 'error'); }
      } catch(e) { toast('请求异常: ' + e.message, 'error'); }
    }

    loadAccounts();
  </script>
</body>
</html>
